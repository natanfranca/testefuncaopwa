<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2e008b">
  <title>Offline - Cuidado Puro</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #2e008b;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p { opacity: 0.9; max-width: 320px; line-height: 1.5; }
    button {
      margin-top: 24px;
      background: white;
      color: #2e008b;
      border: none;
      padding: 12px 28px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Você está offline</h1>
  <p>A conexão com a internet foi perdida. Algumas páginas já visitadas ainda podem ser abertas. Login e dados do sistema precisam de conexão.</p>
  <button onclick="location.reload()">Tentar novamente</button>
  <script>
    window.addEventListener("online", () => location.reload());
  </script>
    <script src="/js/pwa.js"></script>
</body>
</html>
