<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#2e008b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cuidado Puro">
  <link rel="apple-touch-icon" href="../telas/img/pwa-icon-192.png">

  <title>Dashboard Cuidador — Cuidado Puro</title>
  <link rel="stylesheet" href="../css/dashboardCuidador.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <!-- Login -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <p class="eyebrow">Área do cuidador</p>
      <h1>Cuidado Puro</h1>
      <p class="login-hint">Acesso de demonstração. Senha: <strong>cuidado123</strong></p>
      <label for="login-pass">Senha</label>
      <input type="password" id="login-pass" placeholder="Digite a senha" autocomplete="current-password">
      <p id="login-error" class="error-msg"></p>
      <button type="button" id="login-btn" class="btn-primary">Entrar</button>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">♡</span>
        <span class="brand-text">Cuidado Puro</span>
      </div>
      <nav class="sidebar-nav">
        <button type="button" class="nav-item active" data-panel="overview" data-label="Visão geral">
          <i data-lucide="layout-dashboard"></i><span>Visão geral</span>
        </button>
        <button type="button" class="nav-item" data-panel="agenda" data-label="Agenda">
          <i data-lucide="calendar-days"></i><span>Agenda</span>
        </button>
        <button type="button" class="nav-item" data-panel="requests" data-label="Solicitações">
          <i data-lucide="clipboard-list"></i><span>Solicitações</span>
        </button>
        <button type="button" class="nav-item" data-panel="patients" data-label="Pacientes">
          <i data-lucide="users"></i><span>Pacientes</span>
        </button>
        <button type="button" class="nav-item" data-panel="messages" data-label="Mensagens">
          <i data-lucide="message-circle"></i><span>Mensagens</span>
        </button>
        <button type="button" class="nav-item" data-panel="reviews" data-label="Avaliações">
          <i data-lucide="star"></i><span>Avaliações</span>
        </button>
        <button type="button" class="nav-item" data-panel="payments" data-label="Pagamentos">
          <i data-lucide="wallet"></i><span>Pagamentos</span>
        </button>
        <button type="button" class="nav-item" data-panel="settings" data-label="Configurações">
          <i data-lucide="settings"></i><span>Configurações</span>
        </button>
      </nav>
      <div class="sidebar-footer">
        <button type="button" id="logout-btn" class="btn-ghost"><i data-lucide="log-out"></i><span>Sair</span></button>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="top">
        <h2 id="panel-title">Visão geral</h2>
        <p class="top-sub">Painel do cuidador — Cuidado Puro Home Health</p>
      </header>

      <!-- OVERVIEW -->
      <section id="panel-overview" class="panel active">
        <div class="stats">
          <article class="stat-card">
            <span class="stat-label">Consultas</span>
            <strong id="stat-agenda">0</strong>
            <span class="stat-note">agendadas</span>
          </article>
          <article class="stat-card">
            <span class="stat-label">Solicitações</span>
            <strong id="stat-requests">0</strong>
            <span class="stat-note">pendentes</span>
          </article>
